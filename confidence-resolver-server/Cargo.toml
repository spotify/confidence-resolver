[package]
name = "confidence-resolver-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "Self-hosted Confidence flag resolver"
license = "Apache-2.0"

[dependencies]
confidence_resolver = { path = "../confidence-resolver" }
arc-swap = "1.7"
aes-gcm = "0.10"
base64 = "0.22"
axum = "0.8"
bytes = "1"
hex = "0.4"
prost = "0.13"
prost-types = "0.13"
reqwest = { version = "0.13.1", default-features = false, features = ["rustls"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.13", features = ["tls-webpki-roots"] }
tonic-health = "0.13"
tonic-reflection = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
prost-build = "0.13"
tonic-build = "0.13"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
