syntax = "proto3";

package rust_guest;

import "google/protobuf/struct.proto";
import "types.proto";

option java_package = "com.spotify.confidence.wasm";
option java_multiple_files = false;
option java_outer_classname = "Messages";

message Void {}

message InitThreadRequest {
    uint64 rng_seed = 1;
}

message SetResolverStateRequest {
    bytes state = 1;
    string account_id = 2;
    Sdk sdk = 3;
    // Experimental: opt-in apply-event deduplication. When true, identical
    // assignments within a short TTL window are logged once. Off by default.
    bool enable_apply_dedup = 4;
    // Skip apply/assignment logging entirely. When true, WASM never enqueues
    // FlagAssigned events — the assign queue stays empty. Provider skipApply
    // config is forwarded here on every setResolverState.
    bool skip_apply = 5;
}

message ResolveSimpleRequest {
    string client_secret = 1;
    google.protobuf.Struct evaluation_context = 2;
    string name = 3;
}


message Request {
    bytes data = 1;
}

message Response {
    oneof result {
        bytes data = 1;
        string error = 2;
    }
}

message PrometheusSnapshotRequest {
    string instance = 1;
    uint32 buckets_per_decade = 2;
    bool openmetrics = 3;
}

message PrometheusSnapshotResponse {
    string text = 1;
}
