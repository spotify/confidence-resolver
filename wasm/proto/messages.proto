syntax = "proto3";

package rust_guest;

import "google/protobuf/struct.proto";
import "types.proto";

option java_package = "com.spotify.confidence.wasm";
option java_multiple_files = false;
option java_outer_classname = "Messages";

message Void {}

message InitThreadRequest {
    uint64 rng_seed = 1;
}

message SetResolverStateRequest {
    bytes state = 1;
    string account_id = 2;
    Sdk sdk = 3;
    // Apply-event deduplication. When true, byte-identical applies for the same
    // unit and variant within the dedup TTL window are logged once. The
    // OpenFeature providers set this to true by default; set it to false to log
    // every apply.
    bool enable_apply_dedup = 4;
    // Disable exposure (apply/assignment) collection entirely. When true, WASM
    // never enqueues FlagAssigned events — the assign queue stays empty.
    // Provider disableExposureCollection config is forwarded here on every
    // setResolverState.
    bool disable_exposure_collection = 5;
    // Free the previous resolver state before validating the new one. The
    // default (false) keeps the previous state installed until the new one
    // has passed validation, so a failed update never leaves the resolver
    // stateless — at the cost of the old and new state coexisting during the
    // swap. Set this to true to bound the swap's peak memory instead: the
    // previous state is dropped first, and an update whose state fails
    // validation leaves the resolver stateless until the next successful
    // update.
    // EXPERIMENTAL: this flag and the default it modifies may change.
    bool drop_state_before_validation = 6;
}

message ResolveSimpleRequest {
    string client_secret = 1;
    google.protobuf.Struct evaluation_context = 2;
    string name = 3;
}


message Request {
    bytes data = 1;
}

message Response {
    oneof result {
        bytes data = 1;
        string error = 2;
    }
}

message PrometheusSnapshotRequest {
    string instance = 1;
    uint32 buckets_per_decade = 2;
    bool openmetrics = 3;
}

message PrometheusSnapshotResponse {
    string text = 1;
}
