syntax = "proto3";

package confidence.flags.wasm.v1;

option java_package = "com.spotify.confidence.flags.wasm.v1";
option java_multiple_files = true;

import "confidence/flags/admin/v1/types.proto";
import "confidence/flags/resolver/v1/events/events.proto";
// Local patch: this tree keeps ResolveFlagsRequest/Response in api.proto (shared with all
// providers), whereas konfidens/state-to-wasm keeps them in types.proto.
import "confidence/flags/resolver/v1/api.proto";
import "confidence/flags/resolver/v1/types.proto";
import "confidence/flags/types/v1/types.proto";
import "confidence/flags/wasm/v1/telemetry.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";

// WASM resolve process API — suspend/resume protocol for materialization.

message ResolveProcessResponse {
  oneof result {
    Resolved resolved = 1;
    Suspended suspended = 2;
    Error error = 3;
  }

  message Resolved {
    confidence.flags.resolver.v1.ResolveFlagsResponse response = 1;
    repeated Materialization.Record materialization_to_write = 2;
    // The client the request authenticated as, for attributing host-side
    // telemetry (observe_client_resolve_latency) and evaluate.
    uint32 client_index = 3;
  }

  message Suspended {
    uint32 process_id = 1;
    repeated Materialization.Record materialization_to_read = 2;
  }

  // A rejected resolve, for the host to map onto its transport.
  message Error {
    // Values follow the gRPC status codes, so hosts can pass them through.
    enum Code {
      CODE_UNSPECIFIED = 0;
      INVALID_ARGUMENT = 3;
      UNAUTHENTICATED = 16;
    }
    Code code = 1;
    string message = 2;
  }
}

message Materialization {
  repeated Record records = 1;

  message Record {
    string unit = 1;
    string materialization = 2;
    string rule = 3;
    string variant = 4;
  }
}

// WASM evaluate API — provider host interface (see plans/wasm-evaluate.md).

message EvaluateRequest {
  string flag_key = 1;
  google.protobuf.Value default_value = 2;
  confidence.flags.types.v1.FlagSchema expected_schema = 3;
}

message ResolutionDetails {
  google.protobuf.Value value = 1;
  string variant = 2;
  confidence.flags.resolver.v1.ResolveReason reason = 3;
  ErrorCode error_code = 4;
  string error_message = 5;
  bool should_apply = 6;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_PROVIDER_NOT_READY = 1;
  ERROR_CODE_PROVIDER_FATAL = 2;
  ERROR_CODE_FLAG_NOT_FOUND = 3;
  ERROR_CODE_TYPE_MISMATCH = 4;
  ERROR_CODE_GENERAL = 5;
  ERROR_CODE_CYCLE_DETECTED = 6;
}

// WASM logging — packed-slice encoding for passing log bytes out of WASM.

// What the module's write_logs payloads concatenate to. Owned here because
// only the WASM log service reads it; fields 1, 3 and 4 keep the numbers of
// confidence.flags.resolver.v1.WriteFlagLogsRequest, so the bytes also parse
// as that message (without telemetry).
message WriteFlagLogsRequest {
  repeated confidence.flags.resolver.v1.events.FlagAssigned flag_assigned = 1
      [(google.api.field_behavior) = OPTIONAL];

  // The legacy TelemetryData; the module never writes it.
  reserved 2;

  repeated confidence.flags.admin.v1.WriteResolveInfoRequest.ClientResolveInfo client_resolve_info = 3
      [(google.api.field_behavior) = OPTIONAL];
  repeated confidence.flags.admin.v1.WriteResolveInfoRequest.FlagResolveInfo flag_resolve_info = 4
      [(google.api.field_behavior) = OPTIONAL];

  // One report per producer. The module writes one per flush; a host may
  // append its own by concatenating the encoding of a WriteFlagLogsRequest
  // holding it.
  repeated ResolverTelemetry telemetry = 5 [(google.api.field_behavior) = OPTIONAL];

  // How ingestion should handle this request. Unset means the ingestion default.
  // For concatenated encodings the last value on the wire wins, so a host that
  // sets the mode must not append a fragment that sets it too.
  LogMode log_mode = 6 [(google.api.field_behavior) = OPTIONAL];
}

// How epx-flags-ingestion handles a WriteFlagLogsRequest.
enum LogMode {
  // Not set. Ingestion falls back to its configured default (SHADOW today).
  LOG_MODE_UNSPECIFIED = 0;
  // Accept and drop. Nothing is persisted or exported.
  LOG_MODE_NONE = 1;
  // Write to the shadow destinations only.
  LOG_MODE_SHADOW = 2;
  // Write to the production destinations.
  LOG_MODE_LIVE = 3;
}

message WriteLogsPayload {
  repeated fixed64 parts = 1;
  // Compile-time value echoed verbatim from the module; empty when unset.
  string log_token = 2;
}
