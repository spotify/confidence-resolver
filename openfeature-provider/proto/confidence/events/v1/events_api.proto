syntax = "proto3";

package confidence.events.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/spotify/confidence-resolver/openfeature-provider/go/confidence/internal/proto/events";
option java_package = "com.spotify.confidence.sdk.events.v1";
option java_multiple_files = true;
option java_outer_classname = "EventsApiProto";

message Void {}

// A single tracked event, used both as WASM input and in the network batch.
message Event {
  // Event name, e.g. "eventDefinitions/my_event"
  string event_definition = 1;

  // When the event occurred (set by the provider)
  google.protobuf.Timestamp event_time = 2;

  // Merged payload: user-supplied data with evaluation context nested under "context"
  google.protobuf.Struct payload = 3;
}

// Batch of events returned by the WASM flush, ready for network serialization.
// Providers add client_secret, sdk info, and send_time when posting to the API.
message PublishEventsRequest {
  repeated Event events = 1;
}
