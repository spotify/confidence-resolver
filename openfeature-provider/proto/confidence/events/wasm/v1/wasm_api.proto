syntax = "proto3";

// WASM-internal messages for the event engine. Kept in a separate package from
// confidence.events.v1 so these never collide with the canonical events API types.
package confidence.events.wasm.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "confidence/events/v1/types.proto";

option go_package = "github.com/spotify/confidence-resolver/openfeature-provider/go/confidence/internal/proto/eventswasm";
option java_package = "com.spotify.confidence.sdk.events.wasm.v1";
option java_multiple_files = true;
option java_outer_classname = "WasmApiProto";

message Void {}

// OpenFeature-shaped input: what providers send to the WASM on track().
// The WASM prepends "eventDefinitions/" to event_name and transforms this into
// a confidence.events.v1.Event for the network batch.
message TrackEventRequest {
  // Bare event name, e.g. "my_event" (WASM prepends "eventDefinitions/").
  string event_name = 1;

  // When the event occurred (set by the provider).
  google.protobuf.Timestamp event_time = 2;

  // OpenFeature tracking event details: optional numeric value.
  optional double value = 3;

  // OpenFeature evaluation context.
  google.protobuf.Struct context = 4;

  // OpenFeature tracking event custom data.
  google.protobuf.Struct data = 5;
}

// Batch of events drained from the WASM. Providers wrap these in a
// confidence.events.v1.PublishEventsRequest, adding client_secret, send_time
// and sdk, then send via the EventsService gRPC.
message FlushEventsResponse {
  repeated confidence.events.v1.Event events = 1;
}
