syntax = "proto3";

package confidence.wasm;

import "confidence/flags/resolver/v1/types.proto";

option java_package = "com.spotify.confidence.sdk.wasm";
option java_multiple_files = false;
option java_outer_classname = "Messages";
option go_package = "github.com/spotify/confidence-resolver/openfeature-provider/go/confidence/internal/proto/wasm";

message Void {}

message SetResolverStateRequest {
    bytes state = 1;
    string account_id = 2;
    confidence.flags.resolver.v1.Sdk sdk = 3;
    // Apply-event deduplication. When true, byte-identical applies for the same
    // unit and variant within the dedup TTL window are logged once. The
    // OpenFeature providers set this to true by default; set it to false to log
    // every apply.
    bool enable_apply_dedup = 4;
    // Disable exposure (apply/assignment) collection entirely. When true, WASM
    // never enqueues FlagAssigned events — the assign queue stays empty.
    // Provider disableExposureCollection config is forwarded here on every
    // setResolverState.
    bool disable_exposure_collection = 5;
}

message Request {
    bytes data = 1;
}

message Response {
    oneof result {
        bytes data = 1;
        string error = 2;
    }
}

message PrometheusSnapshotRequest {
    string instance = 1;
    uint32 buckets_per_decade = 2;
    bool openmetrics = 3;
}

message PrometheusSnapshotResponse {
    string text = 1;
}
