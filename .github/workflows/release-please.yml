# NOTE: After a release is published, remember to update internal version registries
# with the new version numbers.
#
# On next, release-please-config.json releases release candidates (versioning: prerelease) of
# the rewritten providers only. Each provider adds its package and publish job with
# its rewrite.
name: Release Please

on:
  push:
    branches:
      - main
      - next
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Release Please (manifest)
        id: releasemanifest
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
